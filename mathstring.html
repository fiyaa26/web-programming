
<!DOCTYPE html>
<html>
<head>
    <title>String and Math Objects</title>
</head>

<body bgcolor="pink">

    <h1 align="center">String and Math Functions</h1>
    <hr>

    <h2><u>String Functions</u></h2>

 
<script>
    let x = prompt("Enter a string:");
    let y = prompt("Enter another string:");

    document.write("String = " + x + "<br><br>");
    document.write("Length = " + x.length + "<br><br>");
    document.write("Uppercase = " + x.toUpperCase() + "<br><br>");
    document.write("Lowercase = " + x.toLowerCase() + "<br><br>");
    document.write("Character at position 3 = " + x.charAt(3) + "<br><br>");
    document.write("Index of Script = " + x.indexOf("Script") + "<br><br>");
    document.write("Last index of a = " + x.lastIndexOf("a") + "<br><br>");
    document.write("Concatenation = " + x.concat(" ", y) + "<br><br>");
    document.write("Slicing = " + x.slice(0, 10) + "<br><br>");

    let oldWord = prompt("Enter the word to replace:");
    let newWord = prompt("Enter the new word:");

    document.write("Replacing = " + x.replace(oldWord, newWord) + "<br><br>");
</script>

    <hr>

    <h2><u>Math Functions</u></h2>

    <script>
       var a = Number(prompt("Enter a number:"));

        document.write("Number = " + a + "<br><br>");
        document.write("Square Root = " + Math.sqrt(a) + "<br><br>");
        document.write("Random Value = " + Math.random() + "<br><br>");
        document.write("Power to 3 = " + Math.pow(a, 3) + "<br><br>");
        document.write("Absolute Value = " + Math.abs(a) + "<br><br>");
        document.write("Round Value = " + Math.round(a) + "<br><br>");
        document.write("Ceil Value = " + Math.ceil(a) + "<br><br>");
        document.write("Floor Value = " + Math.floor(a) + "<br><br>");
        document.write("PI Value = " + Math.PI + "<br><br>");
        document.write("Maximum Value = " + Math.max(10, 20, 30, 40) + "<br><br>");
        document.write("Minimum Value = " + Math.min(10, 20, 30, 40) + "<br><br>");
    </script>

</body>
</html>
